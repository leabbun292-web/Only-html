<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>កិច្ចការផ្ទះ HTML</title>
</head>
<body>

    <!-- ចំណុចទី ១៖ ចំណងជើងទំព័រ -->
    <h1>ប្រវត្តិរូបសង្ខេបរបស់ខ្ញុំ</h1>

    <!-- ចំណុចទី ២៖ កថាខណ្ឌទី ១ (ព័ត៌មានផ្ទាល់ខ្លួន) -->
    <p>
        សួស្តី! ខ្ញុំបាទ/នាងខ្ញុំឈ្មោះ <strong>មុត​ ប៊ុនលាប</strong> ជា <u><ins>និស្សិត</ins></u> សិក្សានៅ <em>សាកលវិទ្យាល័យភូមិន្ទភ្នំពេញ</em>។
    </p>

    <!-- ចំណុចទី ៣៖ កថាខណ្ឌទី ២ (ការបញ្ចុះតម្លៃ និងរូបមន្ត) -->
    <p>
        កម្មវិធី <mark>ប្រូម៉ូសិនពិសេស</mark>៖ តម្លៃដើម <del>$20</del> នៅសល់ត្រឹម <strong>$10</strong>។ <br>
        សមីការគណិតវិទ្យា៖ A = B<sup>2</sup> + C<sup>3</sup> <br>
        រូបមន្តឧស្ម័នកាបូនិច៖ CO<sub>2</sub>
    </p>

</body>
</html>
