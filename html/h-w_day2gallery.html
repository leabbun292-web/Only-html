<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <title>ទំព័របង្ហាញរូបភាព - Gallery</title>
</head>
<body>

    <h1>ទំព័របង្ហាញរូបភាព (Gallery)</h1>

    <!-- 1. Local Image ពី folder images/ មាន width="300" និង alt -->
    <h2>១. រូបភាពក្នុងម៉ាស៊ីន (Local Image)</h2>
    <img src="https://d2vbr83hnyiux1.cloudfront.net/image/975050285728/image_or3anctpj55b140rbmo16p276c?w=1024&fit=crop&crop=faces,edges" alt="រូបភាពទេសភាព Local" width="300">

    <!-- 2. Online Image (Absolute URL) មាន loading="lazy" -->
    <h2>២. រូបភាពតាម Online (Absolute URL)</h2>

<img src="https://www.w3schools.com/w3images/lights.jpg"
     alt="រូបភាពពីប្រភពអនឡាញ"
     width="300"
     loading="lazy">

    <!-- 3. Clickable Image (រូបភាពជាតំណភ្ជាប់ បើក Tab ថ្មី) -->
    <h2>៣. រូបភាពចុចបើក Link (Clickable Image)</h2>
    <a href="https://www.w3schools.com" target="_blank">
        <img src="https://www.w3schools.com/html/w3schools.jpg" alt="ចុចលើរូបភាពដើម្បីបើក W3Schools" width="300">
    </a>

    <!-- 4. Figure និង Figcaption -->
   <h2>៤. រូបភាពទេសភាព និងអក្សរពិពណ៌នា</h2>

<figure>
    <img src="https://www.w3schools.com/w3images/mountains.jpg"
         alt="រូបភាពទេសភាពភ្នំ"
         width="300">

    <figcaption>
        រូបភាពទេសភាពភ្នំធម្មជាតិដ៏ស្រស់ស្អាត
    </figcaption>
</figure>
    <br>
    <!-- 5. Link ត្រឡប់មក index.html -->
    <a href="h-w_day2.html">ត្រឡប់មកកាន់ទំព័រដើម</a>
